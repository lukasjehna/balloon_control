[project]
name = "balloon-control"
version = "0.1.0"
description = "Control software for the balloon"
readme = "README.md"
authors = [
    { name = "Lukas Jehna", email = "lukasjehna@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gpiozero>=2.0.1.post3",
    "libpcap>=1.11.0b29",
    "matplotlib>=3.11.2",
    "pigpio>=1.78",
    "pyside6>=6.12.0",
    "rpi-lgpio>=0.6",
    "smbus>=1.1.post2",
]

[project.scripts]
balloon-control = "balloon_control:main"

# Device controls & sensors
chopper-control         = "balloon_control.devices.chopper_control:main"
receiver-control        = "balloon_control.devices.receiver_control:main"
spec-control            = "balloon_control.devices.spec_control:main"
spec-interactive        = "balloon_control.devices.spec_interactive:main"
spec-interactive-save   = "balloon_control.devices.spec_interactive_save:main"
spec-interactive-simple = "balloon_control.devices.spec_interactive_simple:main"
gyro-sensor             = "balloon_control.devices.gyro_sensor:main"
pressure-sensor         = "balloon_control.devices.pressure_sensor:main"
temperature-sensor      = "balloon_control.devices.temperature_sensor:main"
telemetry-sensor        = "balloon_control.devices.telemetry_sensor:main"
led-simple              = "balloon_control.devices.led_simple:main"


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]